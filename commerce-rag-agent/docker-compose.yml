services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: sqlite:///./app/data/commerce.db
      CHROMA_PATH: ./app/data/chroma
      HF_HOME: /models/huggingface
      BGE_M3_ENABLE_REAL: "false"
      CHINESE_CLIP_ENABLE_REAL: "false"
      CHINESE_CLIP_LOCAL_FILES_ONLY: "false"
      HF_HUB_OFFLINE: "0"
      TRANSFORMERS_OFFLINE: "0"
      LLM_BASE_URL: http://101.245.87.173:8080/v1
      LLM_MODEL: Qwen3.6-35B-A3B
      TEXT_EMBEDDING_PROVIDER: qwen
      TEXT_EMBEDDING_BASE_URL: http://1.95.152.83:8001
      TEXT_EMBEDDING_MODEL: Qwen3-Embedding-8B
      TEXT_EMBEDDING_DIMENSION: "4096"
      RERANK_BASE_URL: http://1.95.214.83:8080/v1
      RERANK_MODEL: bge-reranker-v2-m3
    ports:
      - "8000:8000"
    volumes:
      - backend-data:/app/app/data
      - model-cache:/models
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  backend-data:
  model-cache:
