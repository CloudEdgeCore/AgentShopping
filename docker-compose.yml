# ============================================================
# AgentShopping  全栈容器化部署
# 启动命令:  docker compose up -d --build
# 访问地址:  http://localhost:5173  (购物前端)
#            http://localhost:8000  (RAG Agent API)
#            http://localhost:8000/docs  (RAG Agent Swagger)
# ============================================================

services:

  # ─────────────────────── 基础设施 ───────────────────────

  mysql:
    image: mysql:8.0
    container_name: shopping-mysql
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: shopping
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - shopping-net

  redis:
    image: redis:7-alpine
    container_name: shopping-redis
    command: redis-server --requirepass "123456"
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "123456", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shopping-net

  elasticsearch:
    image: elasticsearch:8.14.3
    container_name: shopping-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - shopping-net

  # ────────────────── Java 电商平台后端 ──────────────────

  java-backend:
    build:
      context: ./shopping-platform/backend
      dockerfile: Dockerfile
    container_name: shopping-java-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/shopping?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: "123456"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: "123456"
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
      PLATFORM_LOG_ENV: docker
      PLATFORM_LOG_PATH: /app/runtime-logs
    ports:
      - "8080:8080"
    volumes:
      - java-logs:/app/runtime-logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
    networks:
      - shopping-net

  # ────────────────── Python RAG Agent ──────────────────

  rag-agent:
    build:
      context: ./commerce-rag-agent/backend
      dockerfile: Dockerfile
    container_name: shopping-rag-agent
    environment:
      DATABASE_URL: sqlite:///./app/data/commerce.db
      CHROMA_PATH: ./app/data/chroma
      HF_HOME: /models/huggingface
      BGE_M3_ENABLE_REAL: "false"
      CHINESE_CLIP_ENABLE_REAL: "false"
      CHINESE_CLIP_LOCAL_FILES_ONLY: "false"
      HF_HUB_OFFLINE: "0"
      TRANSFORMERS_OFFLINE: "0"
      JAVA_PLATFORM_BASE_URL: http://java-backend:8080
      JWT_SECRET: "cloudedge-shopping-platform-jwt-secret-2026"
      REDIS_URL: redis://:123456@redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - rag-data:/app/app/data
      - model-cache:/models
    depends_on:
      java-backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks:
      - shopping-net

  # ────────────────── 购物前端 ──────────────────

  shopping-frontend:
    build:
      context: ./shopping-platform/frontend
      dockerfile: Dockerfile
    container_name: shopping-frontend
    ports:
      - "5173:80"
    depends_on:
      java-backend:
        condition: service_healthy
      rag-agent:
        condition: service_healthy
    networks:
      - shopping-net

  # ────────────────── RAG 调试 UI（可选） ──────────────────

  rag-debug:
    build:
      context: ./commerce-rag-agent/web-debug
      dockerfile: Dockerfile
    container_name: shopping-rag-debug
    ports:
      - "8081:80"
    depends_on:
      rag-agent:
        condition: service_healthy
    networks:
      - shopping-net

# ────────────────── 数据卷 ──────────────────

volumes:
  mysql-data:
  redis-data:
  es-data:
  java-logs:
  rag-data:
  model-cache:

# ────────────────── 网络 ──────────────────

networks:
  shopping-net:
    driver: bridge
