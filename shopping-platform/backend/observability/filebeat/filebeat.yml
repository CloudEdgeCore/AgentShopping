filebeat.inputs:
  - type: filestream
    id: shopping-platform-json
    enabled: true
    paths:
      - /var/log/shopping-platform/*.json
    parsers:
      - ndjson:
          overwrite_keys: true
          add_error_key: true
    fields_under_root: true
    fields:
      collector: filebeat
      system: shopping-platform
      log_type: application

processors:
  - add_host_metadata: ~
  - add_fields:
      target: ""
      fields:
        ingest_pipeline: filebeat

setup.ilm.enabled: false
setup.template.enabled: false
setup.kibana:
  host: http://kibana:5601

output.elasticsearch:
  hosts: ["http://elasticsearch:9200"]
  username: "elastic"
  password: "${ELASTIC_PASSWORD}"
  index: "shopping-platform-logs-%{+yyyy.MM.dd}"
  pipeline: "shopping-platform-logs-pipeline"
